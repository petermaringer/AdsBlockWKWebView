name: AdsBlockWKWebView
options:
  #minimumXcodeGenVersion: "2.39.1"
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: at.co.weinmann
  deploymentTarget:
    #iOS: "10.0"
    iOS: "15.0"
  #postGenCommand: pod install
settings:
  APP_DISPLAY_NAME: "AdsBlock"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: $(BITRISE_BUILD_NUMBER)
packages:
  Telegraph: { url: https://github.com/Building42/Telegraph.git, from: 0.40.0 }
  OpenSSL: { url: https://github.com/krzyzanowskim/OpenSSL.git, from: 1.1.2301 }
  CertificateSigningRequest: { url: https://github.com/cbaker6/CertificateSigningRequest.git, from: 1.30.0 }
targets:
  AdsBlockWKWebView:
    type: application
    platform: iOS
    sources:
      - path: AdsBlockWKWebView
        excludes:
          - Excludes
          #- adawayTEST.json
          #- Assets.xcassets/AppIconOld.appiconset
    settings:
      SWIFT_VERSION: "4.0"
      #SWIFT_OBJC_BRIDGING_HEADER: B-Header.h
    entitlements:
      path: AdsBlockWKWebView/App.entitlements
      properties:
        com.apple.security.application-groups: [group.at.co.weinmann.AdsBlockWKWebView]
    scheme:
      configVariants:
    dependencies:
      - target: AdsBlockWKWebView.Share
      - package: Telegraph
      - package: OpenSSL
      - package: CertificateSigningRequest
  AdsBlockWKWebView.Share:
    type: app-extension
    platform: iOS
    #deploymentTarget: "13.0"
    deploymentTarget: "15.0"
    sources:
      - path: AdsBlockWKWebView_Share
    settings:
      SWIFT_VERSION: "5.9.2"
      CODE_SIGN_ENTITLEMENTS: AdsBlockWKWebView_Share/App.entitlements

